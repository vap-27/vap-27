    <text class="hud-title" x="15" y="19" font-size="11" font-weight="700" fill="#f1e05a" text-anchor="middle">JS</text>
    <text class="hud-title" x="40" y="20" font-size="14" font-weight="700" fill="#ffffff">JavaScript</text>
    <text class="hud-title" x="0" y="48" font-size="11" font-weight="500" fill="#64748b">3.4% of public code</text>
