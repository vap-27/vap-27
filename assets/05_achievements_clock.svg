    <!-- Console Outer Frame -->
    <rect x="446" y="96" width="360" height="252" rx="14" fill="#050b16" stroke="#162c4e" stroke-width="1.2" />
    <rect x="447" y="97" width="358" height="250" rx="13" fill="url(#grid-clock-console)" opacity="0.35" />

    <!-- Top Ambient Flare -->
    <ellipse cx="626" cy="108" rx="120" ry="8" fill="#00e5ff" opacity="0.08" filter="blur(10px)" />

    <!-- Header inside Console -->
    <text class="hud-title" x="462" y="116" font-size="8.5" font-weight="800" fill="#00e5ff" letter-spacing="1.5">7-DAY CHRONO RADAR</text>
    <text class="hud-title" x="462" y="127" font-size="6.5" font-weight="700" fill="#475569" letter-spacing="0.5">CYCLICAL RECOGNITION DIAL</text>

