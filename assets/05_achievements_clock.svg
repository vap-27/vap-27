      <line x1="594.7" y1="197.1" x2="566.6" y2="174.6" stroke="#0e1b2e" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="590.0" cy="193.3" r="1.6" fill="#1b314f" />
