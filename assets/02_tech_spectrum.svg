    <circle cx="7" cy="60" r="2.5" fill="#ffffff" filter="url(#glow-soft)" />
  </g>

  <g transform="translate(298, 210)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#0f1a2e" stroke="#1e3458" stroke-width="1" />
    <text class="hud-title" x="15" y="19" font-size="11" font-weight="700" fill="#e34c26" text-anchor="middle">HT</text>
    <text class="hud-title" x="40" y="20" font-size="14" font-weight="700" fill="#ffffff">HTML</text>
    <text class="hud-title" x="0" y="48" font-size="11" font-weight="500" fill="#64748b">0.6% of public code</text>
    <rect x="0" y="58" width="224" height="4" rx="2" fill="#0f1a2e" />
    <rect class="meter-bar" x="0" y="58" width="5" height="4" rx="2" fill="#e34c26" />
    <circle cx="5" cy="60" r="2.5" fill="#ffffff" filter="url(#glow-soft)" />
  </g>

  <g transform="translate(562, 210)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#0f1a2e" stroke="#1e3458" stroke-width="1" />
    <text class="hud-title" x="15" y="19" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">PS</text>
    <text class="hud-title" x="40" y="20" font-size="14" font-weight="700" fill="#ffffff">PowerShell</text>
    <text class="hud-title" x="0" y="48" font-size="11" font-weight="500" fill="#64748b">0.6% of public code</text>
    <rect x="0" y="58" width="224" height="4" rx="2" fill="#0f1a2e" />
    <rect class="meter-bar" x="0" y="58" width="5" height="4" rx="2" fill="#0284c7" />
    <circle cx="5" cy="60" r="2.5" fill="#ffffff" filter="url(#glow-soft)" />
