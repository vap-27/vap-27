<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Preview - vap-27</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 40px 20px 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* GitHub Profile Container simulation */
    .github-profile-wrapper {
      width: 100%;
      max-width: 895px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(1, 4, 9, 0.6);
    }

    .github-readme-header {
      padding: 12px 16px;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #7d8590;
    }

    .github-readme-header span {
      font-weight: 600;
      color: #e6edf3;
    }

    .github-readme-body {
      padding: 32px;
      background-color: #0d1117;
    }

    .card-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .card-container img {
      width: 100%;
      max-width: 840px;
      height: auto;
      border-radius: 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-container img:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15);
    }

    .preview-banner {
      width: 100%;
      max-width: 895px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #0b1e36, #162a45);
      border: 1px solid #1d4ed8;
      border-radius: 8px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .preview-banner strong {
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .badge {
      background-color: #052e16;
      color: #4ade80;
      border: 1px solid #16a34a;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .replay-btn {
      background: #1e3a8a;
      color: #93c5fd;
      border: 1px solid #3b82f6;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .replay-btn:hover {
      background: #2563eb;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Simulation Notification Bar -->
  <div class="preview-banner">
    <div>
      <strong>LOCAL PREVIEW:</strong> Simulating live GitHub Dark Mode rendering for <strong>@vap-27/README.md</strong>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="replay-btn" onclick="replayAnimations()">↻ Replay Animations</button>
      <div class="badge">● LIVE CSS ANIMATIONS ACTIVE</div>
    </div>
  </div>

  <!-- GitHub Profile Card Frame -->
  <div class="github-profile-wrapper">
    <div class="github-readme-header">
      <div>vap-27 / <span>README.md</span></div>
      <div style="font-size: 12px; color: #8b949e;">Profile README · Diamond Pin Avatar (pin_70.png) Active</div>
    </div>

    <div class="github-readme-body">
      <div class="card-container" id="cards">
        <!-- 1. Living Identity -->
        <img src="./assets/01_living_identity.svg" alt="Living Identity / VAP_27" />

        <!-- 2. Technology Spectrum -->
        <img src="./assets/02_tech_spectrum.svg" alt="Technology Spectrum" />

        <!-- 3. Project Constellation -->
        <img src="./assets/03_project_constellation.svg" alt="Project Constellation" />

        <!-- 4. Project Launch Sequence -->
        <img src="./assets/04_launch_sequence.svg" alt="Project Launch Sequence" />

        <!-- 5. Momentum Signal -->
        <img src="./assets/05_momentum_signal.svg" alt="Momentum, made visible" />

        <!-- 6. Contribution Energy -->
        <img src="./assets/06_contribution_energy.svg" alt="Contribution Energy" />
      </div>
    </div>
  </div>

  <script>
    function replayAnimations() {
      const container = document.getElementById('cards');
      const imgs = container.getElementsByTagName('img');
      const ts = Date.now();
      for (let img of imgs) {
        const baseSrc = img.src.split('?')[0];
        img.src = baseSrc + '?t=' + ts;
      }
    }
  </script>
</body>
</html>
