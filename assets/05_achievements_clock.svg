      <rect x="0" y="0" width="100" height="18" rx="4" fill="#09182d" stroke="#183b63" stroke-width="0.8" />
      <circle cx="8" cy="9" r="2.2" fill="#00e5ff" />
      <text class="hud-title" x="15" y="12.5" font-size="6.5" font-weight="800" fill="#e2e8f0" letter-spacing="0.5">LAST: 09:51:54 UTC</text>
    </g>

    <!-- Outer Orbit Dashed Ring (r = 76) -->
    <circle cx="626" cy="222" r="76" fill="none" stroke="#162d4a" stroke-width="1.0" stroke-dasharray="3 5" />

    <!-- Intermediate Micro-Dot Track Ring (r = 52) -->
    <circle cx="626" cy="222" r="52" fill="none" stroke="#0a1728" stroke-width="7" />
    <circle cx="626.0" cy="170.0" r="0.9" fill="#1e3a5f" />
      <circle cx="637.6" cy="171.3" r="0.9" fill="#1e3a5f" />
      <circle cx="648.6" cy="175.1" r="0.9" fill="#1e3a5f" />
      <circle cx="658.4" cy="181.3" r="0.9" fill="#1e3a5f" />
      <circle cx="666.7" cy="189.6" r="0.9" fill="#1e3a5f" />
      <circle cx="672.9" cy="199.4" r="0.9" fill="#1e3a5f" />
      <circle cx="676.7" cy="210.4" r="0.9" fill="#1e3a5f" />
      <circle cx="678.0" cy="222.0" r="0.9" fill="#1e3a5f" />
      <circle cx="676.7" cy="233.6" r="0.9" fill="#1e3a5f" />
      <circle cx="672.9" cy="244.6" r="0.9" fill="#1e3a5f" />
      <circle cx="666.7" cy="254.4" r="0.9" fill="#1e3a5f" />
      <circle cx="658.4" cy="262.7" r="0.9" fill="#1e3a5f" />
      <circle cx="648.6" cy="268.9" r="0.9" fill="#1e3a5f" />
      <circle cx="637.6" cy="272.7" r="0.9" fill="#1e3a5f" />
      <circle cx="626.0" cy="274.0" r="0.9" fill="#1e3a5f" />
      <circle cx="614.4" cy="272.7" r="0.9" fill="#1e3a5f" />
      <circle cx="603.4" cy="268.9" r="0.9" fill="#1e3a5f" />
      <circle cx="593.6" cy="262.7" r="0.9" fill="#1e3a5f" />
      <circle cx="585.3" cy="254.4" r="0.9" fill="#1e3a5f" />
      <circle cx="579.1" cy="244.6" r="0.9" fill="#1e3a5f" />
      <circle cx="575.3" cy="233.6" r="0.9" fill="#1e3a5f" />
      <circle cx="574.0" cy="222.0" r="0.9" fill="#1e3a5f" />
      <circle cx="575.3" cy="210.4" r="0.9" fill="#1e3a5f" />
      <circle cx="579.1" cy="199.4" r="0.9" fill="#1e3a5f" />
      <circle cx="585.3" cy="189.6" r="0.9" fill="#1e3a5f" />
      <circle cx="593.6" cy="181.3" r="0.9" fill="#1e3a5f" />
      <circle cx="603.4" cy="175.1" r="0.9" fill="#1e3a5f" />
      <circle cx="614.4" cy="171.3" r="0.9" fill="#1e3a5f" />

    <!-- Rotating Holographic Gyro Ring -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 626 222"
        to="360 626 222"
        dur="24s"
        repeatCount="indefinite" />
      <circle cx="626" cy="222" r="60" fill="none" stroke="#00e5ff" stroke-width="1.0" stroke-dasharray="14 42 28 56" opacity="0.35" />
      <circle cx="626" cy="222" r="60" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="8 60 12 70" opacity="0.25" />
    </g>

    <!-- Continuous Sweeping 360-Degree Radar Scanner -->
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 626 222"
        to="360 626 222"
        dur="12s"
        repeatCount="indefinite" />
      <line x1="626" y1="222" x2="626" y2="146" stroke="#00e5ff" stroke-width="1.2" opacity="0.8" stroke-linecap="round" />
      <polygon points="626,222 626,146 604,149" fill="url(#radar-slice-grad)" opacity="0.4" />
