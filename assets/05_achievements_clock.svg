    <!-- The 7 Day Spoke Rays & Activity Beams -->
    <g>
      <line x1="626.0" y1="182.0" x2="626.0" y2="146.0" stroke="#0e1b2e" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="626.0" cy="176.0" r="1.6" fill="#1b314f" />
