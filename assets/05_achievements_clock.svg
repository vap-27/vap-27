      <circle cx="626" cy="222" r="38" fill="#060f1c" stroke="#1c3b60" stroke-width="1.5" />
      <circle cx="626" cy="222" r="34" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4" />
      <circle cx="626" cy="222" r="30" fill="#00e5ff" opacity="0.04" filter="blur(6px)" />

      <!-- Center Core Typography -->
