name: Update Profile Signal

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate Dynamic Animated Profile Cards
        env:
          GITHUB_TOKEN: ${{ secrets.FINEGRAINED_PAT || secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_cards.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No visual changes detected in profile cards."
          else
            git commit -m "chore: sync real-time profile telemetry [skip ci]"
            git push
          fi
