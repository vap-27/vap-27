      <line x1="643.4" y1="258.0" x2="659.0" y2="290.5" stroke="#0e1b2e" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="646.0" cy="263.4" r="1.6" fill="#1b314f" />
      <line x1="608.6" y1="258.0" x2="593.0" y2="290.5" stroke="#0e1b2e" stroke-width="2.5" stroke-linecap="round" />
