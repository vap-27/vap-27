  <!-- ================= INTEGRATED FOOTER ================= -->
  <line x1="34" y1="298" x2="806" y2="298" stroke="#162744" stroke-width="1" />
  <text class="hud-title" x="34" y="330" font-size="11" font-weight="600" fill="#93c5fd">TypeScript · Python · CSS · JavaScript · HTML · PowerShell · Shell · Dockerfile <tspan font-style="italic" font-weight="500" fill="#64748b">· chosen for the work, not the trend</tspan></text>
</svg>