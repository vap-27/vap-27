    <text class="hud-title" x="40" y="20" font-size="14" font-weight="700" fill="#ffffff">Python</text>
    <text class="hud-title" x="0" y="48" font-size="11" font-weight="500" fill="#64748b">41.9% of public code</text>
    <rect x="0" y="58" width="224" height="4" rx="2" fill="#0f1a2e" />
    <rect class="meter-bar" x="0" y="58" width="93" height="4" rx="2" fill="#38bdf8" />
    <circle cx="93" cy="60" r="2.5" fill="#ffffff" filter="url(#glow-soft)" />
  </g>

  <g transform="translate(562, 125)">
